spring:
  application:
    name: BloomBoard
  
  datasource:
    url: jdbc:postgresql://localhost:5432/bloomboard
    username: myuser
    password: mypassword
    driver-class-name: org.postgresql.Driver
    
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        
  flyway:
    enabled: true
    baseline-on-migrate: true
    out-of-order: true
    ignore-migration-patterns: "*:*"

  data:
    redis:
      host: localhost
      port: 6379

server:
  port: 8080
