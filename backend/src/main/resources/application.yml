spring:
  application:
    name: BloomBoard
  
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://aws-0-ap-northeast-1.pooler.supabase.com:6543/postgres?sslmode=require&prepareThreshold=0}
    username: ${SPRING_DATASOURCE_USERNAME:myuser}
    password: ${SPRING_DATASOURCE_PASSWORD:mypassword}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 2
      minimum-idle: 0
      idle-timeout: 10000
      max-lifetime: 300000
      connection-timeout: 30000
      keepalive-time: 0
    
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        
  flyway:
    enabled: true
    baseline-on-migrate: true
    out-of-order: true
    repair-on-migrate: true
    ignore-migration-patterns: "*:*"

  data:
    redis:
      url: ${REDIS_URL:redis://localhost:6379}
      timeout: 5000ms
      connect-timeout: 5000ms

server:
  port: ${PORT:8080}
